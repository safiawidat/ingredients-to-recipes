services:
  - type: web
    name: ingredients-to-recipes-api
    runtime: node
    plan: free

    buildCommand: npm run build:render
    startCommand: npm run db:migrate && npm run start --prefix server

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: 22

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGIN
        sync: false

      - key: JWT_SECRET
        sync: false
