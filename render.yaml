services:
  - type: web
    name: ingredients-to-recipes-api
    runtime: node
    plan: free
    rootDir: server

    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm start

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: 22

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGIN
        sync: false
